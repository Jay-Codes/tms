# Modest default lint config for the TMS backend.
# Run via `make lint` (falls back to `go vet` when golangci-lint is absent).
run:
  timeout: 3m
  tests: true

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
    - misspell
    - revive
    - bodyclose
    - errorlint

issues:
  exclude-dirs:
    - internal/db/sqlc # generated by sqlc
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
  max-issues-per-linter: 0
  max-same-issues: 0
