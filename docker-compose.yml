name: tms

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-tms}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tms_dev}
      POSTGRES_DB: ${POSTGRES_DB:-tms}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tms}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tms}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tms_dev_secret}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $${MINIO_ROOT_USER:-tms} $${MINIO_ROOT_PASSWORD:-tms_dev_secret} &&
      mc mb -p local/branding local/qr local/contracts local/kyc &&
      echo buckets ready
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-tms}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-tms_dev_secret}

  # --- full profile (Phase 8): built application images ---
  # api, enduser, tenant, admin, proxy join here under `--profile full`
  # once backend/ and app Dockerfiles land. See PLAN.md "Deployment".

volumes:
  pgdata:
  redisdata:
  miniodata:
